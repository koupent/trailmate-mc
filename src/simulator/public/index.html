<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrailMate Combat Simulator</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>TrailMate Combat Simulator</h1>
        <p>共有戦術ロジックを固定2D投影でtick実行します。</p>
      </div>
      <div class="controls compact">
        <label>Scenario <select id="scenario"></select></label>
        <button id="reset">Reset</button>
        <button id="tick" class="primary">Tick</button>
        <button id="play">Auto</button>
      </div>
    </header>

    <section class="layout">
      <div class="arena-wrap">
        <canvas id="arena" width="760" height="620" aria-label="戦闘シミュレーション平面"></canvas>
        <div class="legend">● Bot　◆ Owner　▲ Enemy　■ Grave　○ Drop　▧ Obstacle</div>
      </div>

      <aside>
        <section>
          <h2>Decision</h2>
          <dl id="decision"></dl>
          <div id="validation"></div>
        </section>
        <section>
          <h2>Edit</h2>
          <label>Entity <select id="entity"></select></label>
          <p class="hint">対象を選び、平面をクリックして移動。</p>
          <div class="controls">
            <select id="enemy-kind">
              <option>zombie</option><option>skeleton</option><option>creeper</option><option>spider</option>
            </select>
            <button id="add-enemy">Add enemy</button>
            <button id="add-drop">Add drop</button>
            <button id="add-obstacle">Add obstacle</button>
            <button id="remove">Remove selected</button>
          </div>
        </section>
        <section>
          <h2>Expected</h2>
          <label>Owner <select id="expect-owner"><option value="">—</option><option>follow</option><option>combat</option><option>recovery</option><option>survival</option></select></label>
          <label>Intent <select id="expect-intent"><option value="">—</option><option>attack</option><option>guard</option><option>dodge</option><option>hold</option></select></label>
          <label>Max span° <input id="expect-span" type="number" min="0" max="360" step="1"></label>
        </section>
        <section>
          <h2>Cases</h2>
          <div class="controls">
            <input id="case-name" placeholder="case name">
            <button id="save">Save</button>
            <select id="saved"></select>
            <button id="load">Load</button>
            <button id="export">Export JSON</button>
            <label class="file">Import <input id="import" type="file" accept="application/json"></label>
          </div>
        </section>
        <section>
          <h2>Transitions</h2>
          <ol id="transitions"></ol>
        </section>
      </aside>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
