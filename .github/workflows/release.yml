name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  TRAILMATE_IMAGE: ghcr.io/${{ github.repository }}
  DASHBOARD_IMAGE: ghcr.io/${{ github.repository_owner }}/trailmate-dashboard

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push trailmate
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.TRAILMATE_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.TRAILMATE_IMAGE }}:latest

      - name: Build and push dashboard
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: true
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.DASHBOARD_IMAGE }}:latest

      - name: Pack Windows distribution ZIP
        run: |
          set -euo pipefail
          STAGE=dist/trailmate-mc-${{ steps.version.outputs.tag }}
          mkdir -p "$STAGE/services/viaproxy" "$STAGE/dashboard/public" "$STAGE/locales" "$STAGE/data"
          cp docker-compose.yml docker-compose.dev.yml Dockerfile package.json package-lock.json \
            tsconfig.json config.example.json .env.example .dockerignore .gitattributes \
            NOTICE LICENSE start.bat stop.bat restart.bat status.bat README.md "$STAGE/"
          cp -r dashboard/Dockerfile dashboard/package.json dashboard/server.mjs dashboard/dockerApi.mjs dashboard/public "$STAGE/dashboard/"
          cp services/viaproxy/viaproxy.yml.example services/viaproxy/README.md "$STAGE/services/viaproxy/"
          cp locales/*.json "$STAGE/locales/"
          # Pin images to this release tag (pull instead of long local builds).
          sed -i "s|ghcr.io/koupent/trailmate-mc:latest|${{ env.TRAILMATE_IMAGE }}:${{ steps.version.outputs.tag }}|g" "$STAGE/docker-compose.yml"
          sed -i "s|ghcr.io/koupent/trailmate-dashboard:latest|${{ env.DASHBOARD_IMAGE }}:${{ steps.version.outputs.tag }}|g" "$STAGE/docker-compose.yml"
          printf '%s\n' "${{ steps.version.outputs.tag }}" > "$STAGE/VERSION"
          (
            cd dist
            zip -r "trailmate-mc-${{ steps.version.outputs.tag }}-windows.zip" "trailmate-mc-${{ steps.version.outputs.tag }}"
          )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/trailmate-mc-${{ steps.version.outputs.tag }}-windows.zip
          generate_release_notes: true
          body: |
            ## 配布物
            - Windows ZIP: 展開して `start.bat` → ダッシュボードでスポーン
            - イメージ:
              - `${{ env.TRAILMATE_IMAGE }}:${{ steps.version.outputs.tag }}`
              - `${{ env.DASHBOARD_IMAGE }}:${{ steps.version.outputs.tag }}`

            コンテナ起動だけではワールドに入りません。ダッシュボードの「スポーン」を押してください。
