name: trailmate-mc_devcontainer

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  viaproxy:
    image: ghcr.io/viaversion/viaproxy:latest
    volumes:
      - ./services/viaproxy:/app/run
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 256m
          mode: 0o1777
    ports:
      - "25568:25568"
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 25568"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 15s
    restart: "no"
    logging: *default-logging

  trailmate:
    build: .
    depends_on:
      viaproxy:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MC_HOST: ${MC_HOST:-viaproxy}
      MC_PORT: ${MC_PORT:-25568}
      MC_AUTH: ${MC_AUTH:-offline}
      BOT_NAME: ${BOT_NAME:-Trailmate}
      COMBAT_TRACE: ${COMBAT_TRACE:-0}
    volumes:
      # Optional local override: uncomment after copying config.example.json -> config.json
      # - ./config.json:/app/config.json:ro
      - ./locales:/app/locales:ro
      - ./src:/app/src:ro
      - ./data:/app/data
      - trailmate_auth:/root/.minecraft
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 256m
          mode: 0o1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    restart: "no"
    logging: *default-logging

volumes:
  trailmate_auth:
    external: true
    name: trailmate-mc_trailmate_auth
