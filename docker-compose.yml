name: trailmate-mc

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  viaproxy:
    image: ghcr.io/viaversion/viaproxy:latest
    volumes:
      - ./services/viaproxy:/app/run
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 256m
          mode: 0o1777
    ports:
      - "25568:25568"
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 25568"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  trailmate:
    image: ghcr.io/koupent/trailmate-mc:latest
    build: .
    depends_on:
      viaproxy:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MC_HOST: ${MC_HOST:-viaproxy}
      MC_PORT: ${MC_PORT:-25568}
      MC_AUTH: ${MC_AUTH:-offline}
      BOT_NAME: ${BOT_NAME:-Trailmate}
      COMBAT_TRACE: ${COMBAT_TRACE:-0}
      CONTROL_PORT: ${CONTROL_PORT:-8790}
      CONTROL_BIND: 0.0.0.0
    volumes:
      - ./.env:/app/.env:ro
      - ./config.json:/app/config.json:ro
      - ./locales:/app/locales:ro
      - ./data:/app/data
      - trailmate_auth:/root/.minecraft
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 256m
          mode: 0o1777
    expose:
      - "8790"
    stop_grace_period: 40s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8790/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    restart: unless-stopped
    logging: *default-logging

  dashboard:
    image: ghcr.io/koupent/trailmate-dashboard:latest
    build:
      context: ./dashboard
    depends_on:
      trailmate:
        condition: service_healthy
    environment:
      DASHBOARD_PORT: 8787
      TRAILMATE_CONTROL_URL: http://trailmate:8790
      PROJECT_ROOT: /project
      COMPOSE_PROJECT_NAME: trailmate-mc
      VIAPROXY_SERVICE: viaproxy
    volumes:
      - ./:/project
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8787:8787"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

volumes:
  trailmate_auth:
    name: trailmate-mc_trailmate_auth
